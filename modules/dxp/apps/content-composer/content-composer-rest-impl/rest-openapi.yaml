components:
    schemas:
        Composition:
            properties:
                brief:
                    type: string
                chatExternalReferenceCode:
                    type: string
                externalReferenceCode:
                    type: string
                id:
                    format: int64
                    readOnly: true
                    type: integer
            type: object
        ExecutionStatus:
            properties:
                externalReferenceCode:
                    readOnly: true
                    type: string
                status:
                    readOnly: true
                    type: string
            type: object
info:
    description:
        "A Java client JAR is available for use with the group ID 'com.liferay', artifact ID
        'com.liferay.content.composer.rest.client', and version '1.0.0'."
    license:
        name: Apache 2.0
        url: http://www.apache.org/licenses/LICENSE-2.0.html
    title: ""
    version: v1.0
openapi: 3.0.1
paths:
    "/compositions/by-external-reference-code/{externalReferenceCode}/execute":
        post:
            operationId: postCompositionByExternalReferenceCodeExecute
            parameters:
                -   in: path
                    name: externalReferenceCode
                    required: true
                    schema:
                        type: string
                -   in: query
                    name: siteExternalReferenceCode
                    required: true
                    schema:
                        type: string
            responses:
                202:
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ExecutionStatus"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/ExecutionStatus"
            tags: ["Composition"]